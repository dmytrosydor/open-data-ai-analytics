apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dtp-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dmytrosydor/open-data-ai-analytics
    targetRevision: main
    path: gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: dtp-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
